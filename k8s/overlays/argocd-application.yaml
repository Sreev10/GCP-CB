apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-gke-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Sreev10/GCP-CB.git'
    targetRevision: HEAD
    path: 'k8s/overlays'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true