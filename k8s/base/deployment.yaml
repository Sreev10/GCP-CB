apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: production
  labels: 
    app: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      serviceAccountName: backend-ksa
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/gke-project-1-500610/app-practice-artifact-repo/backend-api:c637470c7c30bb77d0f659b6b2a535fa29061bcc  # gitleaks:allow
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080 
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
              