steps: 
    # 1. Run secret detection with gitleaks
    - name: 'zricethezav/gitleaks:latest'
      entrypoint: 'sh'
      args: 
        - '-c'
        - git config --global --add safe.directory /workspace && gitleaks detect --source=/workspace --verbose --redact

    # 2. Run filesystem vulnerability scan with trivy
    - name: 'aquasec/trivy:latest'
      args: 
        - 'fs'
        - '--exit-code'
        - '1'
        - '--severity'
        - 'CRITICAL,HIGH'
        - '/workspace'

    # 3. Build Docker container image 
    - name: 'gcr.io/cloud-builders/docker'
      args:
        - 'build'
        - '-t'
        - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/backend-api:$COMMIT_SHA'
        - '-t'
        - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/backend-api:latest'
        - './src'

    # 4. scan container image with trivy before pushing 
    - name: 'aquasec/trivy:latest'
      args:
        - 'image'
        - '--exit-code'
        - '1'
        - '--severity'
        - 'CRITICAL'
        - '--ignore-unfixed'
        - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/backend-api:$COMMIT_SHA'

    # 5. Push validated image to google arrtifact registry
    - name: 'gcr.io/cloud-builders/docker'
      args:
        - 'push'
        - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/backend-api:$COMMIT_SHA'

    - name: 'gcr.io/cloud-builders/docker'
      args:
        -  'push'
        -  '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/backend-api:latest'

    - name: 'gcr.io/cloud-builders/git'
      id: 'UPDATE-GITOPS-MANIFEST'
      entrypoint: 'bash'
      secretEnv:
        - 'GITHUB_TOKEN'
      env:
        - 'PROJECT_ID=$PROJECT_ID'
        - 'COMMIT_SHA=$COMMIT_SHA'
      args:
        - '-c'
        - |
            chmod +x scripts/update-image.sh
            ./scripts/update-image.sh  

    - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:slim'

      id: 'CONFIGURE-GKE'

      entrypoint: 'bash'

      args:

        - '-c'

        - |

            gcloud components install kubectl gke-gcloud-auth-plugin --quiet

            export USE_GKE_GCLOUD_AUTH_PLUGIN=True

            gcloud container clusters get-credentials $_CLUSTER_NAME \

              --region $_REGION \

              --project $PROJECT_ID

            kubectl get nodes

  # 8. Install Argo CD and create Argo CD Application

    - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:slim'

      id: 'INSTALL-ARGOCD'

      entrypoint: 'bash'

      args:

         - '-c'

         - |

            kubectl create namespace argocd \

              --dry-run=client \

              -o yaml | kubectl apply -f -

            kubectl apply -n argocd \

              -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

            kubectl wait \

              --for=condition=Available \

              deployment/argocd-server \

              -n argocd \

              --timeout=300s

            kubectl apply \

              -f k8s/overlays/argocd-application.yaml

            kubectl get applications -A        

substitutions:
    _REGION: 'us-central1'
    _REPO_NAME: 'app-practice-artifact-repo' 
    _CLUSTER_NAME: 'practice-gke-cluster' 

serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/jenkins-cicd@gke-project-1-500610.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
options:
    logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/GitHub-token/versions/latest'
      env: 'GITHUB_TOKEN'

